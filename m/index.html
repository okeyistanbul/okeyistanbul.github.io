<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masaya davet · Okey İstanbul</title>
<meta name="description" content="Arkadaşın seni Okey İstanbul'da masasına çağırıyor.">
<meta property="og:title" content="Okey İstanbul · Masaya davet">
<meta property="og:description" content="Arkadaşın seni masasına çağırıyor. Dokun, uygulama açılsın ve masaya otur.">
<style>
  :root { --bg:#2c070d; --card:#5a1220; --ink:#fff4e2; --muted:#e6cfb4; --gold:#f4c542; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 20%,#7a1a2a,var(--bg) 70%); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:min(92vw,440px); padding:28px 22px 24px; border-radius:20px; background:linear-gradient(160deg,var(--card),#2c070d); box-shadow:inset 0 0 0 2px var(--gold),0 14px 40px rgba(0,0,0,.5); text-align:center; }
  h1 { margin:0 0 6px; font:800 26px/1.2 Georgia,serif; color:#ffd35a; }
  p { margin:0 0 16px; color:var(--muted); }
  .code { margin:6px 0 18px; font:800 40px/1 ui-monospace,Menlo,monospace; letter-spacing:.12em; color:#ffe590; }
  .btn { display:block; margin:10px 0; padding:14px; border-radius:14px; font-weight:800; font-size:17px; text-decoration:none; color:#3a2606; background:linear-gradient(#ffe590,#c48514); box-shadow:0 3px 0 #8a5f14; }
  .btn.s { color:var(--ink); background:rgba(255,255,255,.1); box-shadow:none; font-weight:700; }
  small { display:block; margin-top:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Masaya davet</h1>
  <p id="who">Arkadaşın seni <b id="game">Okey</b> masasına çağırıyor.</p>
  <div class="code" id="code">····</div>
  <a class="btn" id="open" href="#">Uygulamada aç</a>
  <a class="btn s" id="and" href="https://play.google.com/store/apps/details?id=com.okeyistanbul.app">Google Play'den indir</a>
  <a class="btn s" id="ios" href="#" style="display:none">App Store'dan indir</a>
  <small>Uygulama açılmazsa önce indir, sonra bu bağlantıya tekrar dokun ya da Arkadaşlarla oyna → Kodla katıl bölümüne kodu yaz.</small>
</main>
<script>
(function(){
  var IOS_URL = ''; // App Store bağlantısı yayına girince buraya yazılır
  var q = new URLSearchParams(location.search), c = (q.get('c') || '').replace(/\D/g, '').slice(0, 6), g = q.get('g') === '101' ? '101' : 'k';
  document.getElementById('code').textContent = c || '····';
  document.getElementById('game').textContent = g === '101' ? '101 Okey' : 'Klasik Okey';
  var app = 'okeyistanbul://join?c=' + c + '&g=' + g, ua = navigator.userAgent || '';
  var o = document.getElementById('open'); o.href = app;
  var isIOS = /iPhone|iPad|iPod/.test(ua), isAnd = /Android/.test(ua);
  if (isIOS) { document.getElementById('and').style.display = 'none'; if (IOS_URL) { var i = document.getElementById('ios'); i.href = IOS_URL; i.style.display = ''; } }
  if (isAnd) o.href = 'intent://join?c=' + c + '&g=' + g + '#Intent;scheme=okeyistanbul;package=com.okeyistanbul.app;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.okeyistanbul.app') + ';end';
  if (c && (isIOS || isAnd)) setTimeout(function () { location.href = o.href; }, 300);
})();
</script>
</body>
</html>
